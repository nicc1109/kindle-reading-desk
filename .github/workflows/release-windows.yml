name: Release Windows app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($packageVersion -ne $tagVersion) {
            throw "Tag $tagVersion does not match package version $packageVersion"
          }

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run dist:win

      - name: Match installer filenames to the update manifest
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          Move-Item -LiteralPath "release/Reading Desk Setup $packageVersion.exe" -Destination "release/Reading-Desk-Setup-$packageVersion.exe"
          Move-Item -LiteralPath "release/Reading Desk Setup $packageVersion.exe.blockmap" -Destination "release/Reading-Desk-Setup-$packageVersion.exe.blockmap"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Reading Desk ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            app/release/*.exe
            app/release/*.exe.blockmap
            app/release/latest.yml
